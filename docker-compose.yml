services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dota_app
    working_dir: /var/www
    volumes:
      - ./symfony:/var/www
    depends_on:
      - postgres
      - redis
      - clickhouse
      - kafka

  nginx:
    image: nginx:stable-alpine
    container_name: dota_nginx
    ports:
      - "8080:80"
    volumes:
      - ./symfony:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:16
    container_name: dota_postgres
    environment:
      POSTGRES_DB: dota
      POSTGRES_USER: dota
      POSTGRES_PASSWORD: dota
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dota_redis
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: dota_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: dota
      CLICKHOUSE_PASSWORD: dota_password
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  kafka:
    image: apache/kafka:4.1.1
    container_name: dota_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

volumes:
  postgres_data:
  clickhouse_data:
  kafka_data: