[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:kafka-matches-consumer]
command=php /var/www/bin/console messenger:consume kafka_parse_matches --time-limit=3600 --memory-limit=256M
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=KAFKA_BROKERS="kafka:9092"