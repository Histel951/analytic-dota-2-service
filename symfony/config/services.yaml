# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Fantasy Score Calculation Configuration (The International 2026)
    fantasy_scoring.kills_multiplier: 107
    fantasy_scoring.deaths_base: 1950
    fantasy_scoring.deaths_penalty: 195
    fantasy_scoring.creeps_multiplier: 3
    fantasy_scoring.gpm_multiplier: 2
    fantasy_scoring.tower_multiplier: 352
    fantasy_scoring.observer_multiplier: 117
    fantasy_scoring.stacks_multiplier: 234
    fantasy_scoring.rune_multiplier: 141
    fantasy_scoring.roshan_multiplier: 1172
    fantasy_scoring.courier_multiplier: 703
    fantasy_scoring.stun_multiplier: 10
    fantasy_scoring.first_blood_bonus: 1934
    fantasy_scoring.teamfight_multiplier: 2124
    fantasy_scoring.teamfight_max_score: 2124
    fantasy_scoring.tormentor_multiplier: 879
    fantasy_scoring.smoke_multiplier: 293
    fantasy_scoring.watcher_multiplier: 147

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    # --- Shared

    ClickHouseDB\Client:
        factory: [ App\Shared\Infrastructure\ClickHouse\ClickHouseFactory, create ]

    # --- Ingestion

    # Внешние источники данных: какой адаптер обслуживает сценарий (OpenDota | STRATZ).
    # Dota2ApiClient регистрирует бандл dota-api; используется только адаптерами App\Ingestion\Infrastructure\Source.
    App\Ingestion\Domain\Port\MatchSource:
        alias: App\Ingestion\Infrastructure\Source\OpenDota\OpenDotaMatchSource

    App\Ingestion\Domain\Port\TeamMatchesSource:
        alias: App\Ingestion\Infrastructure\Source\OpenDota\OpenDotaTeamMatchesSource

    App\Ingestion\Infrastructure\Persistence\ClickHouse\AnalyticMatchAnalyticsRepository:
        arguments:
            $clickhouse: '@ClickHouseDB\Client'

    App\Ingestion\Domain\Port\AnalyticMatchRepository:
        alias: App\Ingestion\Infrastructure\Persistence\ClickHouse\AnalyticMatchAnalyticsRepository

    App\Ingestion\Infrastructure\Persistence\Postgres\PsqlTeamMatchRepository:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    App\Ingestion\Domain\Port\TeamMatchRepository:
        alias: App\Ingestion\Infrastructure\Persistence\Postgres\PsqlTeamMatchRepository

    App\Ingestion\Infrastructure\Kafka\KafkaTopicsConfig:
        arguments:
            $matchesParse: 'dota2.matches.parse.v1'
            $matchesFailed: 'dota2.matches.failed.v1'
            $matchesAnalytics: 'dota2.matches.analytics.v1'
            $playersAggregate: 'dota2.players.aggregate.v1'
            $fantasyCalculate: 'dota2.fantasy.calculate.v1'

    # --- Fantasy

    # Fantasy Scoring Configuration
    App\Fantasy\Domain\Scoring\FantasyScoringConfig:
        arguments:
            $killsMultiplier: '%fantasy_scoring.kills_multiplier%'
            $deathsBase: '%fantasy_scoring.deaths_base%'
            $deathsPenalty: '%fantasy_scoring.deaths_penalty%'
            $creepsMultiplier: '%fantasy_scoring.creeps_multiplier%'
            $gpmMultiplier: '%fantasy_scoring.gpm_multiplier%'
            $towerMultiplier: '%fantasy_scoring.tower_multiplier%'
            $observerMultiplier: '%fantasy_scoring.observer_multiplier%'
            $stacksMultiplier: '%fantasy_scoring.stacks_multiplier%'
            $runeMultiplier: '%fantasy_scoring.rune_multiplier%'
            $roshanMultiplier: '%fantasy_scoring.roshan_multiplier%'
            $courierMultiplier: '%fantasy_scoring.courier_multiplier%'
            $stunMultiplier: '%fantasy_scoring.stun_multiplier%'
            $firstBloodBonus: '%fantasy_scoring.first_blood_bonus%'
            $teamfightMultiplier: '%fantasy_scoring.teamfight_multiplier%'
            $teamfightMaxScore: '%fantasy_scoring.teamfight_max_score%'
            $tormentorMultiplier: '%fantasy_scoring.tormentor_multiplier%'
            $smokeMultiplier: '%fantasy_scoring.smoke_multiplier%'
            $watcherMultiplier: '%fantasy_scoring.watcher_multiplier%'

    App\Fantasy\Domain\Scoring\FantasyScoreCalculator:
        arguments:
            $config: '@App\Fantasy\Domain\Scoring\FantasyScoringConfig'

    App\Fantasy\Infrastructure\Persistence\ClickHouse\ClickHouseFantasyStatsRepository:
        arguments:
            $clickhouse: '@ClickHouseDB\Client'

    App\Fantasy\Domain\Port\FantasyStatsRepository:
        alias: App\Fantasy\Infrastructure\Persistence\ClickHouse\ClickHouseFantasyStatsRepository

    App\Fantasy\Infrastructure\Persistence\ClickHouse\ClickHouseFantasyMetricAnalysisRepository:
        arguments:
            $clickhouse: '@ClickHouseDB\Client'

    App\Fantasy\Domain\Port\FantasyMetricAnalysisRepository:
        alias: App\Fantasy\Infrastructure\Persistence\ClickHouse\ClickHouseFantasyMetricAnalysisRepository

    App\Fantasy\UI\Console\ExportTopFantasyMetricsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # --- Statistics

    App\Statistics\Infrastructure\Persistence\ClickHouse\ClickHousePlayerStatsReadRepository:
        arguments:
            $clickhouse: '@ClickHouseDB\Client'

    App\Statistics\Domain\Port\PlayerStatsReadRepository:
        alias: App\Statistics\Infrastructure\Persistence\ClickHouse\ClickHousePlayerStatsReadRepository

    App\Statistics\Infrastructure\Persistence\ClickHouse\ClickHouseTeamFormAnalysisRepository:
        arguments:
            $clickHouseFactory: '@App\Shared\Infrastructure\ClickHouse\ClickHouseFactory'

    App\Statistics\Domain\Port\TeamFormAnalysisRepository:
        alias: App\Statistics\Infrastructure\Persistence\ClickHouse\ClickHouseTeamFormAnalysisRepository
